,891.550 888.141,865.000 888.141,775.000" fill="none" stroke="#137FA7" stroke-width="4"/><polyline points="1448.000,1450.000 1448.000,1396.000 1447.201,1369.450 1442.550,1342.900 1432.851,1316.350 1419.740,1289.800 1406.354,1263.250 1393.462,1236.700 1381.065,1210.150 1369.164,1183.600 1357.758,1157.050 1346.847,1130.500 1336.432,1103.950 1326.511,1077.400 1317.086,1050.850 1308.157,1024.300 1299.722,997.750 1291.782,971.200 1284.733,944.650 1279.937,918.100 1277.757,891.550 1277.389,865.000 1277.389,775.000" fill="none" stroke="#137FA7" stroke-width="4"/><polyline points="95.000,365.000 175.000,365.000" fill="none" stroke="#ABB6BF" stroke-width="3" stroke-dasharray="9,9"/><text x="195" y="371.5" font-size="25" fill="#64798A" text-anchor="start">原 20 cm 版</text><polyline points="480.000,365.000 560.000,365.000" fill="none" stroke="#137FA7" stroke-width="4"/><text x="580" y="371.5" font-size="25" fill="#137FA7" text-anchor="start">平順改善版</text><text x="90" y="1530.64" font-size="24" fill="#253D4F" text-anchor="start">上方接相同的 90° 彎道與原剖面噴嘴；本圖只比較轉接段與直段。</text><text x="90" y="1579.78" font-size="23" fill="#64798A" text-anchor="start">線條為截面尺寸示意，並非流線，也不表示已預測壓損或風速。</text><text x="90" y="1647.36" font-size="26" fill="#128A78" text-anchor="start">截面積沿程單調縮小：7216 → 約 2154 mm²。</text><text x="90" y="1695.64" font-size="24" fill="#253D4F" text-anchor="start">展寬及變薄速度首尾平滑歸零；避免在短距離內集中變形。</text><polygon points="1700.000,210.000 2530.000,210.000 2530.000,1690.000 1700.000,1690.000" fill="#F8FBFD" stroke="#D6E1E8" stroke-width="2"/><text x="1740" y="278.66" font-size="31" fill="#18334B" text-anchor="start">在同樣高度內重新分配風道</text><text x="1740" y="352.36" font-size="26" fill="#64798A" text-anchor="start">入口直段</text><text x="1740" y="401.66" font-size="31" fill="#137FA7" text-anchor="start">20 mm → 12 mm</text><text x="1740" y="497.36" font-size="26" fill="#64798A" text-anchor="start">轉接段</text><text x="1740" y="546.66" font-size="31" fill="#137FA7" text-anchor="start">75 mm → 118 mm</text><text x="1740" y="642.36" font-size="26" fill="#64798A" text-anchor="start">彎前直段</text><text x="1740" y="691.66" font-size="31" fill="#137FA7" text-anchor="start">55 mm → 20 mm</text><polyline points="1740.000,790.000 2490.000,790.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="1740" y="854.08" font-size="28" fill="#18334B" text-anchor="start">幾何角度比較（相對向上方向）</text><text x="1740" y="912.36" font-size="26" fill="#137FA7" text-anchor="start">側緣寬度投影：約 50.2° → 29.2°</text><text x="1740" y="967.36" font-size="26" fill="#137FA7" text-anchor="start">中央前後壁：約 46.3° → 27.2°</text><text x="1740" y="1020.64" font-size="24" fill="#253D4F" text-anchor="start">邊緣路徑三維角：約 57.6° → 38.5°</text><text x="1740" y="1084.78" font-size="23" fill="#64798A" text-anchor="start">角度來自形狀計算，不是量測風速。</text><polyline points="1740.000,1120.000 2490.000,1120.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="1740" y="1184.08" font-size="28" fill="#18334B" text-anchor="start">維持單件、無附加測量構造</text><text x="1740" y="1241.5" font-size="25" fill="#253D4F" text-anchor="start">進風口：82 × 88；原法蘭與孔位</text><text x="1740" y="1291.5" font-size="25" fill="#253D4F" text-anchor="start">出風弧長 160；2 mm 縫；R 中 28</text><text x="1740" y="1341.5" font-size="25" fill="#253D4F" text-anchor="start">主要壁厚仍為 2 mm</text><text x="1740" y="1411.5" font-size="25" fill="#128A78" text-anchor="start">幾何材料體積約再減少 2.1%。</text><text x="1740" y="1459.78" font-size="23" fill="#64798A" text-anchor="start">不含列印支撐與切片設定。</text><text x="1740" y="1530.64" font-size="24" fill="#64798A" text-anchor="start">尚未實測壓損、流量與風速。</text><text x="1740" y="1590.64" font-size="24" fill="#253D4F" text-anchor="start">列印時使用 mm、100% 比例。</text><text x="1740" y="1639.78" font-size="23" fill="#64798A" text-anchor="start">切片預覽確認內部支撐可移除。</text><polyline points="70.000,1750.000 2530.000,1750.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="70" y="1799.78" font-size="23" fill="#64798A" text-anchor="start">原版檔案保留｜新檔只有單一實體網格｜已檢查進出風口、2 mm 縫與 20 cm 包絡｜未執行 CFD</text></g></svg>