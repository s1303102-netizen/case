-width="2"/><polyline points="1444.595,753.400 1518.095,753.400" fill="none" stroke="#128A78" stroke-width="3"/><polygon points="1518.095,753.400 1506.095,748.000 1506.095,758.800" fill="#128A78" stroke="none" stroke-width="2"/><text x="1430" y="710.64" font-size="24" fill="#137FA7" text-anchor="start">2 mm</text><text x="980" y="1570.64" font-size="24" fill="#253D4F" text-anchor="start">側壁測壓：外徑 6／內孔 3</text><text x="980" y="1620.64" font-size="24" fill="#64798A" text-anchor="start">測壓口未接管時，裝封帽並密封</text><text x="980" y="1669.78" font-size="23" fill="#64798A" text-anchor="start">示意省略外壁厚度與對合座</text><polygon points="1770.000,210.000 2530.000,210.000 2530.000,1700.000 1770.000,1700.000" fill="#F8FBFD" stroke="#D6E1E8" stroke-width="2"/><text x="1810" y="277.8" font-size="30" fill="#18334B" text-anchor="start">保留原版的局部風刀條件</text><text x="1810" y="343.22" font-size="27" fill="#137FA7" text-anchor="start">2 mm 縫、90° 彎角</text><text x="1810" y="384.78" font-size="23" fill="#253D4F" text-anchor="start">同風速時，縫尺度 Reynolds 數保留</text><text x="1810" y="463.22" font-size="27" fill="#137FA7" text-anchor="start">相同 R／厚度與收縮剖面</text><text x="1810" y="504.78" font-size="23" fill="#253D4F" text-anchor="start">彎曲與噴嘴局部形狀保留</text><text x="1810" y="583.22" font-size="27" fill="#137FA7" text-anchor="start">弧長改為 240 mm</text><text x="1810" y="624.78" font-size="23" fill="#253D4F" text-anchor="start">不能代表原 593 mm 全弧均勻度</text><polyline points="1810.000,700.000 2490.000,700.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="1810" y="764.08" font-size="28" fill="#18334B" text-anchor="start">假設平均風速 25 m/s：</text><text x="1810" y="823.22" font-size="27" fill="#253D4F" text-anchor="start">原版需要：約 1.778 m³/min</text><text x="1810" y="873.22" font-size="27" fill="#253D4F" text-anchor="start">測試主縫：約 0.720 m³/min</text><text x="1810" y="923.22" font-size="27" fill="#D97736" text-anchor="start">旁通差額：約 1.058 m³/min</text><text x="1810" y="979.78" font-size="23" fill="#64798A" text-anchor="start">以上是尺寸換算，並非風速預測。</text><polyline points="1810.000,1015.000 2490.000,1015.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="1810" y="1079.08" font-size="28" fill="#18334B" text-anchor="start">旁通孔片：</text><text x="1810" y="1131.5" font-size="25" fill="#253D4F" text-anchor="start">封閉／28／32／36／38／40／44</text><text x="1810" y="1180.64" font-size="24" fill="#D97736" text-anchor="start">先試 38 mm，再按壓力與風速更換。</text><text x="1810" y="1229.78" font-size="23" fill="#64798A" text-anchor="start">每次只裝一片；孔徑不等於等效阻力。</text><polyline points="1810.000,1265.000 2490.000,1265.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="1810" y="1329.08" font-size="28" fill="#18334B" text-anchor="start">建議列印左右半片</text><text x="1810" y="1386.5" font-size="25" fill="#253D4F" text-anchor="start">每片約 278 × 179.3 × 135.4</text><text x="1810" y="1435.64" font-size="24" fill="#253D4F" text-anchor="start">各自一盤；STL 已將切面朝下。</text><text x="1810" y="1485.64" font-size="24" fill="#253D4F" text-anchor="start">旁通片印 1 片；封帽印 2 個。</text><text x="1810" y="1545.64" font-size="24" fill="#64798A" text-anchor="start">接合後量測實際 2 mm 窄縫。</text><text x="1810" y="1599.78" font-size="23" fill="#64798A" text-anchor="start">切片時確認搭橋與支撐可移除。</text><text x="1810" y="1649.78" font-size="23" fill="#64798A" text-anchor="start">未經實體試印與阻力校準。</text><polyline points="70.000,1750.000 2530.000,1750.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="70" y="1800.64" font-size="24" fill="#64798A" text-anchor="start">可直接接原鼓風機的短弧測試件｜原模型未修改｜幾何檢查通過；未執行 CFD 或實測</text></g></svg>