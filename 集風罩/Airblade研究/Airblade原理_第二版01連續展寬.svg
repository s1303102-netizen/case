<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="298.846mm" viewBox="0 0 2600 1850"><rect width="2600" height="1850" fill="white"/><g font-family="STHeiti, PingFang TC, Noto Sans CJK TC, sans-serif"><polygon points="0.000,0.000 2600.000,0.000 2600.000,14.000 0.000,14.000" fill="#18334B" stroke="none" stroke-width="2"/><text x="70" y="90.97999999999999" font-size="43" fill="#18334B" text-anchor="start">Airblade 原理｜更平順的第二版導風管</text><text x="70" y="139.64" font-size="24" fill="#64798A" text-anchor="start">以封閉流道導向、漸收噴嘴加速、精密窄縫成形；右半邊與中央 50 mm 保留段沿用。</text><polyline points="70.000,166.000 2530.000,166.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="70" y="1807.78" font-size="23" fill="#64798A" text-anchor="start">借用公開 Airblade 原理的候選設計；並非 Dyson 原廠尺寸圖｜未做 CFD｜Blender 檔案未修改</text><text x="2530" y="1809.5" font-size="25" fill="#64798A" text-anchor="end">1 / 2</text><polygon points="70.000,210.000 830.000,210.000 830.000,1680.000 70.000,1680.000" fill="#F8FBFD" stroke="#D6E1E8" stroke-width="2"/><text x="105" y="278.8" font-size="30" fill="#18334B" text-anchor="start">從 Airblade 公開資料學到什麼</text><text x="105" y="348.94" font-size="29" fill="#137FA7" text-anchor="start">① 末端收縮要緩</text><text x="105" y="394.5" font-size="25" fill="#253D4F" text-anchor="start">乾手機專利的一個實施例：</text><text x="105" y="438.22" font-size="27" fill="#253D4F" text-anchor="start">兩壁各約 7°，夾角約 14°。[1]</text><text x="105" y="477.92" font-size="22" fill="#64798A" text-anchor="start">這是特定實施例，並非所有型號的剖面。</text><text x="105" y="561.94" font-size="29" fill="#137FA7" text-anchor="start">② 窄縫與刀口要精準</text><text x="105" y="608.36" font-size="26" fill="#253D4F" text-anchor="start">Airblade V 官方標示窄縫 0.55 mm。[2]</text><text x="105" y="651.5" font-size="25" fill="#253D4F" text-anchor="start">噴嘴製造專利強調控制長縫寬度。[3]</text><text x="105" y="695.5" font-size="25" fill="#128A78" text-anchor="start">此案先保留 2 mm，搭配您的工作風壓。</text><text x="105" y="776.94" font-size="29" fill="#137FA7" text-anchor="start">③ 支撐件不能形成粗大阻擋</text><text x="105" y="824.5" font-size="25" fill="#253D4F" text-anchor="start">公開剖面使用流線形的縫寬支撐件。[1]</text><text x="105" y="867.64" font-size="24" fill="#253D4F" text-anchor="start">若本罩需支撐，採圓鼻、細尾並留恢復段。</text><text x="105" y="954.94" font-size="29" fill="#137FA7" text-anchor="start">④ 高風速需要足夠的風壓</text><text x="105" y="1001.5" font-size="25" fill="#253D4F" text-anchor="start">V 官方標示 690 km/h；供氣系統不同。[2]</text><text x="105" y="1044.64" font-size="24" fill="#128A78" text-anchor="start">您的 460 Pa 工作情境，速度仍約 25–26 m/s。</text><text x="105" y="1087.78" font-size="23" fill="#64798A" text-anchor="start">窄縫不能憑空補出高壓，也不保證提高風速。</text><polyline points="105.000,1134.000 795.000,1134.000" fill="none" stroke="#D6E1E8" stroke-width="2"/><text x="105" y="1195.8" font-size="30" fill="#18334B" text-anchor="start">此版的主要改變</text><text x="105" y="1245.5" font-size="25" fill="#253D4F" text-anchor="start">展寬與變薄，移到整段上升風道完成。</text><text x="105" y="1290.5" font-size="25" fill="#253D4F" text-anchor="start">整條薄氣流平順轉 90°，不再先進厚腔。</text><text x="105" y="1336.36" font-size="26" fill="#137FA7" text-anchor="start">末段只由約 12.2 mm 緩收至 2 mm。</text><text x="105" y="1380.5" font-size="25" fill="#253D4F" text-anchor="start">關注曲面連續、局部分離與縫寬一致性。</text><text x="105" y="1457.06" font-size="21" fill="#64798A" text-anchor="start">[1] EP1909627B1：圖 7a–7c 及對應說明</text><text x="105" y="1501.06" font-size="21" fill="#64798A" text-anchor="start">[2] Dyson 台灣 Airblade V 官方資料</text><text x="105" y="1545.06" font-size="21" fill="#64798A" text-anchor="start">[3] WO2013057476A1 / EP2768369B1</text><text x="105" y="1593.06" font-size="21" fill="#64798A" text-anchor="start">原文網址與適用限制見同資料夾研究說明。</text><text x="910" y="246.66" font-size="31" fill="#18334B" text-anchor="start">A　連續展寬的扇形風道（展開示意）</text><text x="910" y="286.78" font-size="23" fill="#64798A" text-anchor="start">展開寬度以實際上游弧長表示；收縮後貼合原 593 mm 出風弧。</text><polygon points="1567.680,1077.840 1567.676,1072.385 1567.647,1066.930 1567.571,1061.476 1567.425,1056.021 1567.190,1050.566 1